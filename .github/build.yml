name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          n=$(ls -1 *.zip 2>/dev/null | wc -l)
          if [ "$n" != "1" ]; then echo "::error::Keep exactly ONE .zip in the repo (found $n). Delete the old one."; exit 1; fi
          unzip -o -q -- *.zip
          cd AnswerLens
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../AnswerLens.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: AnswerLens.apk
